<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Distance Game</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f7;
      --panel: #ffffff;
      --text: #18202c;
      --muted: #667085;
      --line: #d8e0ea;
      --accent: #0f766e;
      --accent-2: #115e59;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.8rem;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(15, 118, 110, 0.26);
      text-decoration: none;
    }

    button:hover { filter: brightness(1.02); }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Distance Game</h1>
      <p class="subtitle">Choose an action to continue.</p>
      <div class="actions">
        <button type="button" onclick="window.location.href='/api/game'">Start game</button>
        <button type="button" onclick="window.location.href='/api/history'">Open game history</button>
      </div>
    </section>
  </main>
</body>
</html>
